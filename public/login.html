<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول | دورية الاستراحة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-side">
      <div class="brand-chip">لوحة الإدارة</div>
      <h1 class="login-title">دورية الاستراحة</h1>
      <p class="login-subtitle">
        تسجيل الدخول للوصول إلى لوحة التحكم وإدارة الجدول الأسبوعي للأعضاء بشكل منظم وواضح.
      </p>

      <div class="feature-list">
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span>إدارة الأسابيع والتوزيع بسهولة</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span>واجهة مناسبة للجوال والكمبيوتر</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span>صلاحيات دخول للأدمن فقط</span>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="login-card-head">
          <div class="login-logo">🔐</div>
          <h2>تسجيل الدخول</h2>
          <p>أدخل بياناتك للمتابعة إلى لوحة الإدارة</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input
              id="email"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <div class="password-field">
              <input
                id="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button type="button" id="togglePassword" class="toggle-password">إظهار</button>
            </div>
          </div>

          <button type="submit" id="loginBtn" class="primary-btn">
            دخول
          </button>

          <p id="msg" class="status-message"></p>
        </form>

        <div class="login-card-foot">
          <a href="./schedule.html" class="back-link">العودة إلى صفحة الجدول</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/supabase.js"></script>
  <script src="./assets/login.js"></script>
</body>
</html>
