<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول | دورية الاستراحة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="authPage">
  <main class="authWrap">
    <section class="authCard">
      <div class="authHead">
        <div class="authBadge">🔐</div>
        <h1>تسجيل الدخول</h1>
        <p>لوحة إدارة دورية الاستراحة</p>
      </div>

      <form id="loginForm" class="authForm" novalidate>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="name@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="passwordWrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
              minlength="6"
            />
            <button type="button" class="togglePassword" id="togglePassword" aria-label="إظهار أو إخفاء كلمة المرور">
              إظهار
            </button>
          </div>
        </div>

        <button id="loginBtn" class="btn primary full" type="submit">
          دخول
        </button>

        <p id="formMessage" class="formMessage" aria-live="polite"></p>
      </form>

      <div class="authFoot">
        <a href="./schedule" class="textLink">العودة إلى الجدول</a>
      </div>
    </section>
  </main>

  <script src="./config/supabase.js"></script>
  <script src="./assets/login.js"></script>
</body>
</html>
